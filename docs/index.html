<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hiring.kang — 채용 데이터 대시보드</title>
<style>
  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --text: #1a1d21;
    --text-dim: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --danger: #dc2626;
    --ok: #059669;
    --hover: #f3f6fc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216;
      --surface: #181b21;
      --text: #e8eaed;
      --text-dim: #9aa2af;
      --line: #2a2f38;
      --accent: #5b8def;
      --accent-soft: #1c2536;
      --danger: #f87171;
      --ok: #34d399;
      --hover: #1f2430;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    padding: 28px 24px 0;
    max-width: 1200px;
    margin: 0 auto;
  }
  h1 { margin: 0 0 4px; font-size: 22px; }
  h1 span { color: var(--accent); }
  .meta { color: var(--text-dim); font-size: 13px; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px 24px 60px; }

  .tabs { display: flex; gap: 8px; margin: 18px 0 14px; flex-wrap: wrap; }
  .tab {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    padding: 9px 16px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .tab .cnt { color: var(--text-dim); font-size: 12px; }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .tab.active .cnt { color: rgba(255,255,255,.8); }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .controls input[type=search] {
    flex: 1;
    min-width: 220px;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
  }
  .controls input[type=search]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  label.toggle { display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 13px; cursor: pointer; white-space: nowrap; }

  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; min-width: 720px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--text-dim); font-weight: 600; white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--hover); }
  tbody tr:last-child td { border-bottom: none; }
  td .sub { color: var(--text-dim); font-size: 12.5px; margin-top: 2px; }
  .badge {
    display: inline-block;
    font-size: 11.5px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    white-space: nowrap;
  }
  .dday { font-weight: 700; white-space: nowrap; }
  .dday.urgent { color: var(--danger); }
  .dday.open { color: var(--ok); }
  .dday.closed { color: var(--text-dim); font-weight: 400; }
  .nowrap { white-space: nowrap; }
  .empty { padding: 40px; text-align: center; color: var(--text-dim); }
  .more { display: block; width: 100%; padding: 12px; border: none; background: none; color: var(--accent); font-size: 14px; cursor: pointer; }
  .count-line { color: var(--text-dim); font-size: 12.5px; margin: 0 2px 8px; }
  footer { max-width: 1200px; margin: 0 auto; padding: 0 24px 40px; color: var(--text-dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>hiring<span>.kang</span> 채용 데이터</h1>
  <div class="meta" id="meta">데이터 불러오는 중…</div>
</header>
<main>
  <div class="tabs" id="tabs"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="검색 (기업명·공고 제목·지역…)">
    <div class="chips" id="chips"></div>
    <label class="toggle" id="hideClosedWrap" hidden>
      <input type="checkbox" id="hideClosed" checked> 마감 제외
    </label>
  </div>
  <div class="count-line" id="countLine"></div>
  <div class="table-wrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
    <button class="more" id="moreBtn" hidden>더 보기</button>
  </div>
</main>
<footer>
  출처: 고용24 Open API · 행 클릭 시 해당 공고/기업 페이지로 이동합니다 · 데이터는 수집 시점 기준입니다.
</footer>

<script>
const TYPES = {
  open_emp:  { label: "공채속보",  chipKey: "corpType" },
  events:    { label: "채용행사",  chipKey: "area" },
  companies: { label: "공채기업",  chipKey: "corpType" },
};
const PAGE = 100;
const EVENT_SEARCH = "https://www.work24.go.kr/wk/a/f/1100/retrieveEmpEventList.do?searchText=";

let DATA = null;
let state = { type: "open_emp", q: "", chip: "", shown: PAGE, hideClosed: true };

const $ = (id) => document.getElementById(id);
const todayStr = new Date().toISOString().slice(0, 10);

function dday(end) {
  if (!end) return null;
  const diff = Math.floor((new Date(end + "T23:59:59") - new Date()) / 86400000);
  return diff;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function rowUrl(item) {
  if (state.type === "events") return EVENT_SEARCH + encodeURIComponent(item.name);
  return item.url || "";
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  let items = DATA[state.type];
  if (state.type === "open_emp" && state.hideClosed) {
    items = items.filter((it) => !it.end || it.end >= todayStr);
  }
  if (state.chip) {
    const key = TYPES[state.type].chipKey;
    items = items.filter((it) => (it[key] || "").includes(state.chip));
  }
  if (q) {
    items = items.filter((it) =>
      Object.values(it).some((v) => String(v).toLowerCase().includes(q))
    );
  }
  return items;
}

function ddayCell(end) {
  const d = dday(end);
  if (d === null) return "";
  if (d < 0) return '<span class="dday closed">마감</span>';
  if (d === 0) return '<span class="dday urgent">오늘 마감</span>';
  if (d <= 7) return `<span class="dday urgent">D-${d}</span>`;
  return `<span class="dday open">D-${d}</span>`;
}

const RENDER = {
  open_emp: {
    head: ["기업명", "공고 제목", "기업형태", "고용형태", "접수기간", "마감"],
    row: (it) => `
      <td class="nowrap"><strong>${esc(it.company)}</strong></td>
      <td>${esc(it.title)}</td>
      <td class="nowrap">${it.corpType ? `<span class="badge">${esc(it.corpType)}</span>` : ""}</td>
      <td>${esc(it.empType)}</td>
      <td class="nowrap">${esc(it.start)} ~ ${esc(it.end)}</td>
      <td>${ddayCell(it.end)}</td>`,
  },
  events: {
    head: ["행사명", "지역", "기간", "시작"],
    row: (it) => `
      <td><strong>${esc(it.name)}</strong></td>
      <td class="nowrap"><span class="badge">${esc(it.area)}</span></td>
      <td class="nowrap">${esc(it.term)}</td>
      <td>${ddayStart(it.start)}</td>`,
  },
  companies: {
    head: ["기업명", "기업형태", "소개"],
    row: (it) => `
      <td class="nowrap"><strong>${esc(it.name)}</strong></td>
      <td class="nowrap">${it.corpType ? `<span class="badge">${esc(it.corpType)}</span>` : ""}</td>
      <td>${esc(it.summary)}${it.intro && it.intro !== it.summary ? `<div class="sub">${esc(it.intro)}</div>` : ""}</td>`,
  },
};

function ddayStart(start) {
  const d = dday(start);
  if (d === null) return "";
  if (d < 0) return '<span class="dday closed">종료/진행중</span>';
  if (d === 0) return '<span class="dday urgent">오늘</span>';
  return `<span class="dday open">D-${d}</span>`;
}

function renderTabs() {
  $("tabs").innerHTML = Object.entries(TYPES)
    .map(([k, t]) =>
      `<button class="tab ${k === state.type ? "active" : ""}" data-type="${k}">
        ${t.label} <span class="cnt">${DATA[k].length.toLocaleString()}</span>
      </button>`)
    .join("");
}

function renderChips() {
  const key = TYPES[state.type].chipKey;
  const counts = {};
  for (const it of DATA[state.type]) {
    const v = (it[key] || "").trim();
    if (v) counts[v] = (counts[v] || 0) + 1;
  }
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8);
  $("chips").innerHTML = top
    .map(([v]) => `<button class="chip ${state.chip === v ? "active" : ""}" data-chip="${esc(v)}">${esc(v)}</button>`)
    .join("");
}

function render() {
  renderTabs();
  renderChips();
  $("hideClosedWrap").hidden = state.type !== "open_emp";

  const items = filtered();
  const slice = items.slice(0, state.shown);
  const spec = RENDER[state.type];

  $("thead").innerHTML = `<tr>${spec.head.map((h) => `<th>${h}</th>`).join("")}</tr>`;
  $("tbody").innerHTML = slice.length
    ? slice.map((it, i) => `<tr data-i="${i}">${spec.row(it)}</tr>`).join("")
    : `<tr><td colspan="${spec.head.length}"><div class="empty">조건에 맞는 항목이 없습니다.</div></td></tr>`;

  $("countLine").textContent =
    `${items.length.toLocaleString()}건 중 ${Math.min(state.shown, items.length).toLocaleString()}건 표시`;
  $("moreBtn").hidden = items.length <= state.shown;

  $("tbody").querySelectorAll("tr[data-i]").forEach((tr) => {
    tr.addEventListener("click", () => {
      const url = rowUrl(slice[+tr.dataset.i]);
      if (url) window.open(url, "_blank", "noopener");
    });
  });
}

$("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  state.type = btn.dataset.type;
  state.chip = "";
  state.shown = PAGE;
  render();
});
$("chips").addEventListener("click", (e) => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  state.chip = state.chip === btn.dataset.chip ? "" : btn.dataset.chip;
  state.shown = PAGE;
  render();
});
$("q").addEventListener("input", (e) => {
  state.q = e.target.value;
  state.shown = PAGE;
  render();
});
$("hideClosed").addEventListener("change", (e) => {
  state.hideClosed = e.target.checked;
  state.shown = PAGE;
  render();
});
$("moreBtn").addEventListener("click", () => {
  state.shown += PAGE;
  render();
});

fetch("data.json")
  .then((r) => r.json())
  .then((d) => {
    DATA = d;
    $("meta").textContent = `마지막 수집: ${d.generated_at} · 공채속보 ${d.open_emp.length}건 · 채용행사 ${d.events.length}건 · 공채기업 ${d.companies.length.toLocaleString()}건`;
    render();
  })
  .catch(() => {
    $("meta").textContent = "data.json을 불러오지 못했습니다.";
  });
</script>
</body>
</html>
